services:
  app:
    build:
      args:
        user: www-data
        uid: 1000
      context: ./
      dockerfile: dockerfile
    image: sw-gestion-obras
    container_name: sw-gestion-obras
    restart: unless-stopped
    working_dir: /var/www/html/
    volumes:
      - ./src:/var/www/html/
    ports:
      - "8080:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_obras
      DB_USERNAME: gestion_obras
      DB_PASSWORD: gestion_obras
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]

  db:
    image: mysql:8.0
    container_name: sw-gestion-obras-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_obras
      MYSQL_USER: gestion_obras
      MYSQL_PASSWORD: gestion_obras
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
